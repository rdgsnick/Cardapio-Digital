<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <header class="topbar">
    <h1>Painel Admin — Cardápio</h1>
  </header>

  <main class="admin-layout">

    <section class="form-card">
      <h2 id="form-titulo">Adicionar item</h2>
      <form id="form-item">
        <input type="hidden" id="item-id">

        <label>Nome
          <input type="text" id="item-nome" required placeholder="Ex: Bruschetta">
        </label>

        <label>Descrição
          <textarea id="item-desc" placeholder="Descrição curta do prato"></textarea>
        </label>

        <label>Preço (R$)
          <input type="number" id="item-preco" step="0.01" min="0" required placeholder="0.00">
        </label>

        <label>URL da imagem
          <input type="text" id="item-imagem" placeholder="images/exemplo.jpg">
        </label>

        <div class="form-botoes">
          <button type="submit" id="btn-salvar">Adicionar</button>
          <button type="button" id="btn-cancelar" class="btn-secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="lista-card">
      <h2>Itens do cardápio</h2>
      <div id="lista-itens" class="lista-itens"></div>
    </section>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="admin.js"></script>
</body>
</html>
