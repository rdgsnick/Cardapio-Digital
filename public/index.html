<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="mesa">MESA <span id="numero-mesa">--</span></div>
    <h1 class="nome-restaurante">Sabor & Cia</h1>
  </header>

  <div class="layout">
    <main id="cardapio" class="feed"></main>

    <aside class="carrinho">
      <h2>Seu pedido</h2>
      <div id="carrinho-lista" class="carrinho-lista">
        <p class="carrinho-vazio">Nenhum item ainda</p>
      </div>
      <div class="carrinho-total-linha">
        <span>Total</span>
        <span id="carrinho-total">R$ 0,00</span>
      </div>
      <button id="btn-enviar" disabled>Confirmar pedido</button>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
